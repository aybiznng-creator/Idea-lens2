<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IdeaLens — Startup Evaluator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #0a0a0f;
      --card:       #13131c;
      --border:     #1e1e2e;
      --accent:     #c8f74a;
      --accent-dim: rgba(200,247,74,0.10);
      --text:       #e8e8f0;
      --muted:      #6b6b80;
      --danger:     #ff6b6b;
      --danger-dim: rgba(255,107,107,0.09);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      padding: 2.5rem 1rem 5rem;
      background-image:
        radial-gradient(ellipse 60% 40% at 80% 5%,  rgba(200,247,74,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 90%, rgba(100,80,255,0.06) 0%, transparent 60%);
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 2.8rem; }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 7vw, 4rem);
      letter-spacing: -0.03em;
    }
    .logo span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ── Layout ── */
    .container { max-width: 660px; margin: 0 auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem 2.2rem;
      margin-bottom: 1.4rem;
    }

    /* ── Section label ── */
    .section-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.6rem;
    }

    /* ── Form fields ── */
    .field { margin-bottom: 1.3rem; }

    label {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.45rem;
    }

    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.82rem 1rem;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.86rem;
      line-height: 1.5;
      outline: none;
      resize: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,247,74,0.09);
    }

    textarea { min-height: 115px; }
    input::placeholder, textarea::placeholder { color: #333345; }

    /* ── Submit button ── */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      padding: 1rem;
      font-family: 'Syne', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.15s;
    }

    .btn:hover:not(:disabled) { opacity: 0.86; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }

    /* ── Progress bar ── */
    .progress {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 1.2rem;
      overflow: hidden;
      display: none;
    }
    .progress.active { display: block; }
    .progress::after {
      content: '';
      display: block;
      height: 100%;
      width: 38%;
      background: var(--accent);
      border-radius: 2px;
      animation: sweep 1.1s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-160%); }
      100% { transform: translateX(400%); }
    }

    .loading-hint {
      text-align: center;
      margin-top: 0.9rem;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: #333345;
      animation: blink 1.6s ease infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Error box ── */
    .error-box {
      display: none;
      background: var(--danger-dim);
      border: 1px solid rgba(255,107,107,0.28);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 1rem;
      line-height: 1.5;
    }

    /* ── Results ── */
    #results {
      display: none;
      animation: fadeUp 0.42s ease both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* Score */
    .score-row {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      margin-bottom: 1.6rem;
    }

    .score-ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--accent-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .score-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .score-denom {
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .score-info strong {
      font-family: 'Syne', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      display: block;
      margin-bottom: 0.3rem;
    }

    .score-info p {
      font-size: 0.79rem;
      color: var(--muted);
      line-height: 1.65;
    }

    /* Result sections */
    .divider { height: 1px; background: var(--border); margin: 1.3rem 0; }

    .result-section h3 {
      font-family: 'Syne', sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.8rem;
    }

    .result-section ul { list-style: none; }

    .result-section li {
      display: flex;
      gap: 0.6rem;
      padding: 0.52rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.83rem;
      line-height: 1.55;
      color: #c8d0e0;
    }

    .result-section li:last-child { border-bottom: none; }

    .bullet          { flex-shrink: 0; color: var(--accent); margin-top: 1px; }
    .bullet.is-risk  { color: var(--danger); }

    /* ── Reset link ── */
    .reset-link {
      display: inline-block;
      margin-top: 1.4rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .reset-link:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="logo">Idea<span>Lens</span></div>
  <p class="tagline">AI-powered startup idea evaluator</p>
</header>

<div class="container">

  <!-- ── Form card ── -->
  <div class="card" id="formCard">
    <div class="section-label">// Submit Your Idea</div>

    <div class="field">
      <label for="ideaDescription">Idea Description</label>
      <textarea id="ideaDescription"
        placeholder="Describe your startup idea — what problem does it solve and how?"></textarea>
    </div>

    <div class="field">
      <label for="targetAudience">Target Audience</label>
      <input type="text" id="targetAudience"
        placeholder="e.g. Remote design teams, freelance developers..." />
    </div>

    <div class="field">
      <label for="pricingModel">Pricing Model</label>
      <input type="text" id="pricingModel"
        placeholder="e.g. Freemium + Pro at $29/mo, One-time $99..." />
    </div>

    <button class="btn" id="submitBtn" onclick="evaluateIdea()">
      Evaluate My Idea
    </button>

    <div class="progress" id="progressBar"></div>
    <div class="loading-hint" id="loadingHint" style="display:none">
      ANALYSING WITH AI...
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <!-- ── Results card ── -->
  <div class="card" id="results">
    <div class="section-label">// Evaluation Report</div>

    <div class="score-row">
      <div class="score-ring">
        <span class="score-num"  id="scoreNum">–</span>
        <span class="score-denom">/ 10</span>
      </div>
      <div class="score-info">
        <strong>Market Clarity Score</strong>
        <p id="scoreDesc"></p>
      </div>
    </div>

    <div class="divider"></div>
    <div class="result-section">
      <h3>⚠ Risk Factors</h3>
      <ul id="riskList"></ul>
    </div>

    <div class="divider"></div>
    <div class="result-section">
      <h3>💡 Monetization Suggestions</h3>
      <ul id="monetizationList"></ul>
    </div>

    <div class="divider"></div>
    <div class="result-section">
      <h3>🛠 Suggested MVP Features</h3>
      <ul id="mvpList"></ul>
    </div>

    <button class="reset-link" onclick="resetForm()">← Evaluate another idea</button>
  </div>

</div><!-- /container -->

<script>
  // ── Helpers ────────────────────────────────────────────────────
  function scoreDescription(s) {
    if (s >= 9) return 'Exceptional clarity. Strong product-market fit with a well-defined audience.';
    if (s >= 7) return 'Good clarity. Well-scoped idea with a clear value proposition.';
    if (s >= 5) return 'Moderate clarity. Some areas need refinement before going to market.';
    if (s >= 3) return 'Low clarity. Positioning and audience need significant work.';
    return 'Very unclear market fit. Consider rethinking the core value proposition.';
  }

  function buildList(id, items, riskBullet = false) {
    const ul = document.getElementById(id);
    ul.innerHTML = '';
    (items || []).forEach(text => {
      const li  = document.createElement('li');
      const cls = riskBullet ? 'bullet is-risk' : 'bullet';
      li.innerHTML = `<span class="${cls}">▸</span><span>${text}</span>`;
      ul.appendChild(li);
    });
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = '✕  ' + msg;
    box.style.display = 'block';
  }

  function setLoading(active) {
    document.getElementById('submitBtn').disabled = active;
    document.getElementById('submitBtn').textContent = active ? 'Evaluating…' : 'Evaluate My Idea';
    document.getElementById('progressBar').classList.toggle('active', active);
    document.getElementById('loadingHint').style.display = active ? 'block' : 'none';
  }

  // ── Main evaluation function ───────────────────────────────────
  async function evaluateIdea() {
    const ideaDescription = document.getElementById('ideaDescription').value.trim();
    const targetAudience  = document.getElementById('targetAudience').value.trim();
    const pricingModel    = document.getElementById('pricingModel').value.trim();

    // Reset UI
    document.getElementById('results').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';

    if (!ideaDescription || !targetAudience || !pricingModel) {
      showError('Please fill in all three fields before submitting.');
      return;
    }

    setLoading(true);

    try {
      const res  = await fetch('/evaluate', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ ideaDescription, targetAudience, pricingModel }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `Server error (${res.status}). Please try again.`);
      }

      // Populate results
      document.getElementById('scoreNum').textContent  = data.marketClarityScore;
      document.getElementById('scoreDesc').textContent = scoreDescription(data.marketClarityScore);

      buildList('riskList',          data.riskFactors,             true);
      buildList('monetizationList',  data.monetizationSuggestions, false);
      buildList('mvpList',           data.suggestedMVPFeatures,    false);

      document.getElementById('results').style.display = 'block';
      document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      showError(err.message || 'Unexpected error. Please try again.');
    } finally {
      setLoading(false);
    }
  }

  // ── Reset ──────────────────────────────────────────────────────
  function resetForm() {
    document.getElementById('results').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('ideaDescription').value = '';
    document.getElementById('targetAudience').value  = '';
    document.getElementById('pricingModel').value    = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('ideaDescription').focus();
  }

  // Enter key on single-line inputs submits the form
  ['targetAudience', 'pricingModel'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') evaluateIdea();
    });
  });
</script>

</body>
</html>
